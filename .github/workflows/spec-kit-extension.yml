name: adrkit Spec Kit extension reference validation

# ADR-0014 rung-2 evidence for the adrkit Spec Kit extension.
#
# Installs the extension from its published, release-backed artifact into a real
# Spec Kit project, at every upstream version the extension's own manifest claims
# to support, and asserts its behavior against this repository's real ADR corpus.
#
# This workflow is the self-verifying half of rung 2: it fails the run when
# observed behavior diverges from expected, rather than producing a log for a
# human to interpret. The matrix is what continuously substantiates the
# supported range — if upstream breaks the extension on any pinned version,
# this goes red. The extension's manifest claims `>=0.13.0,<0.16.0`; this
# validation covers only the versions where the *published* install path
# actually works, which excludes 0.13.0. See README, "The 0.13.0 exclusion".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly, so upstream drift surfaces here rather than in a consumer's repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  # The published extension artifact under test — the release asset a consumer
  # downloads, not a source tree and not the npm tarball (the two differ; the
  # npm tarball ships package.json, the release asset does not). The sha256 is
  # what makes the pin immutable: the script verifies it before installing
  # anything. Bumping any of these three is a re-verification.
  ADRKIT_EXT_TAG: "spec-kit-v0.1.3"
  ADRKIT_EXT_VERSION: "0.1.3"
  ADRKIT_EXT_URL: "https://github.com/mbeacom/adrkit/releases/download/spec-kit-v0.1.3/adrkit.zip"
  ADRKIT_EXT_SHA256: "bab0cecd273983424fb33dfabd05067551e154920db1c0e7ac1d2a513d387451"
  # The published CLI surface a real consumer installs.
  ADRKIT_CLI_VERSION: "0.11.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every upstream version on which the published install path works.
        # 0.13.0 is deliberately absent — see README, "The 0.13.0 exclusion".
        specify_version: ["0.14.4", "0.15.1"]
    steps:
      - name: Check out this reference repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the extension against spec-kit ${{ matrix.specify_version }}
        env:
          SPECIFY_VERSION: ${{ matrix.specify_version }}
          EVIDENCE_OUT: ${{ runner.temp }}/evidence-${{ matrix.specify_version }}.md
        run: ./scripts/validate-spec-kit-extension.sh

      - name: Upload expected-vs-observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-kit-extension-evidence-${{ matrix.specify_version }}
          path: ${{ runner.temp }}/evidence-${{ matrix.specify_version }}.md
          if-no-files-found: warn
