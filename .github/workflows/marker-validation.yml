name: adrkit marker validation

# Validates adrkit's inbound `@adr` source-marker behavior against this
# repository's real corpus and its checked-in marker fixtures.
#
# Markers are the headline feature of adrkit v0.5.0/v0.6.0, and until this
# workflow existed they were the largest gap in this repository's coverage: no
# file here declared a marker, so resolution, the `declared by` edge, the
# dangling and foreign-log findings, and the measured scan extent were all
# structurally present and functionally unexercised.
#
# The `--self-test` pass is the point of running this in CI rather than by hand.
# It perturbs each fixture in a throwaway copy and requires the matching
# assertion to FAIL, so a rule that silently stopped being enforced upstream
# shows up as a vacuous assertion here rather than as a green run. See README.md
# ("Marker coverage").

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly, for the same reason the MCP validation runs weekly: this asserts
    # behavior of a pinned dependency, and a scheduled run separates "nobody
    # touched this repository" from "the behavior still holds".
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  validate-markers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this reference repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # scripts/assert-markers.mjs is plain ESM with no dependencies, but
          # pinning the major keeps it off whatever the runner image ships.
          node-version: "22"

      - name: Validate marker behavior, and prove each assertion fails when violated
        run: ./scripts/validate-markers.sh --self-test
