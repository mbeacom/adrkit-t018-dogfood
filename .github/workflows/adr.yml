name: ADR governance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mbeacom/adrkit/packages/ci@b840e915477c6532ca9697eae1fa277cafa971bc
        with:
          dir: docs/adr
