name: ADR ARB queue (managed issue)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: queue
        uses: mbeacom/adrkit/packages/ci/queue@9a4bdf89680b1a5b358fba0f2c8c88b9f5ac7877
        with:
          dir: docs/adr
      - name: Verify managed queue issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.queue.outputs.issue-number }}
        run: ./scripts/verify-managed-queue-issue.sh
