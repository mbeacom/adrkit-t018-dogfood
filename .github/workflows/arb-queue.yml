name: ADR ARB queue (managed issue)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: queue
        uses: mbeacom/adrkit/packages/ci/queue@bbe63e017274f173dbb40eeaceccd17df346b32b
        with:
          dir: docs/adr
      - name: Verify managed queue issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.queue.outputs.issue-number }}
        run: ./scripts/verify-managed-queue-issue.sh
